name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Install compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .build-tools | Out-Null
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile .build-tools/inno.exe
          if ((Get-AuthenticodeSignature .build-tools/inno.exe).Status -ne 'Valid') { throw 'Invalid compiler signature' }
          Start-Process .build-tools/inno.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/NOICONS',"/DIR=$PWD\.build-tools\Inno" -WindowStyle Hidden -Wait
      - name: Test and package
        shell: pwsh
        run: ./packaging/build.ps1 -Python python
      - uses: actions/upload-artifact@v4
        with:
          name: ChildRegistry-Windows-1.0.1
          path: |
            installer-output/ChildRegistry-Setup-1.0.1.exe
            installer-output/SHA256.txt
          if-no-files-found: error
